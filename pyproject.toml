[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemocascade"
version = "0.1.0"
description = "Execution-verified cost cascade for NVIDIA Nemotron models on Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nemocascade contributors" }]
keywords = ["nebius", "nvidia", "nemotron", "agents", "llm", "cost-optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nemocascade = "nemocascade.cli:main"

[tool.setuptools]
packages = ["nemocascade", "devtools"]
